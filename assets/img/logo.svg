<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NX4 Hub logo">
  <defs>
    <linearGradient id="nx4g" x1="70" y1="60" x2="450" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.45" stop-color="#3b9dff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="nx4txt" x1="130" y1="280" x2="390" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38e1ff"/>
      <stop offset="0.55" stop-color="#5b8dff"/>
      <stop offset="1" stop-color="#a071ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#05060b"/>

  <!-- outer hex -->
  <polygon points="256,32 450,144 450,368 256,480 62,368 62,144"
           fill="none" stroke="url(#nx4g)" stroke-width="14" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- inner hex -->
  <polygon points="256,70 417,163 417,349 256,442 95,349 95,163"
           fill="none" stroke="url(#nx4g)" stroke-width="2.5" stroke-linejoin="round" opacity="0.55"/>

  <g filter="url(#glow)">
    <text x="256" y="312" text-anchor="middle" fill="url(#nx4txt)"
          font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="176" font-weight="800" letter-spacing="6">NX4</text>
  </g>

  <rect x="197" y="337" width="118" height="3" rx="1.5" fill="#7fb8ff" opacity="0.9"/>

  <text x="256" y="396" text-anchor="middle" fill="#f4f1e8"
        font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="50" font-weight="700" letter-spacing="16">HUB</text>
</svg>
