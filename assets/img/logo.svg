<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="NX4 Hub logo">
  <defs>
    <linearGradient id="nx4g" x1="70" y1="60" x2="450" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.45" stop-color="#3b9dff"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="nx4txt" x1="130" y1="180" x2="390" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38e1ff"/>
      <stop offset="0.55" stop-color="#5b8dff"/>
      <stop offset="1" stop-color="#a071ff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#05060b"/>

  <polygon points="256,28 453.5,142 453.5,370 256,484 58.5,370 58.5,142"
           fill="none" stroke="url(#nx4g)" stroke-width="12" stroke-linejoin="round" filter="url(#glow)"/>
  <polygon points="256,60 425.7,158 425.7,354 256,452 86.3,354 86.3,158"
           fill="none" stroke="url(#nx4g)" stroke-width="1.5" stroke-linejoin="round" opacity="0.5"/>

  <text x="256" y="268" text-anchor="middle" fill="url(#nx4txt)"
        font-family="Space Grotesk, Inter, 'Segoe UI', Arial, sans-serif" font-size="138" font-weight="700"
        textLength="268" lengthAdjust="spacingAndGlyphs" dx="-2">NX4</text>

  <rect x="200" y="288" width="112" height="3" rx="1.5" fill="#7fb8ff" opacity="0.9"/>

  <text x="256" y="341" text-anchor="middle" fill="#f4f1e8"
        font-family="Space Grotesk, Inter, 'Segoe UI', Arial, sans-serif" font-size="46" font-weight="500"
        textLength="126" lengthAdjust="spacing">HUB</text>
</svg>
