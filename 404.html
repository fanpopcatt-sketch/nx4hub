<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — NX4 Hub</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/css/style.css" />
<style>
  .nf-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 40px 24px;
  }
  .nf-code {
    font-family: Sora, Inter, sans-serif;
    font-size: clamp(88px, 18vw, 160px);
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.05em;
    background: var(--grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .nf-wrap p { color: var(--muted); margin: 18px 0 30px; }
</style>
</head>
<body>
<div class="bg-fx" aria-hidden="true">
  <div class="grid-plane"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
</div>

<div class="nf-wrap">
  <div>
    <div class="nf-code">404</div>
    <h1>Nothing in this lobby.</h1>
    <p>The page you're looking for doesn't exist or moved.</p>
    <a class="btn btn-primary" href="/">Back to NX4 Hub</a>
  </div>
</div>
</body>
</html>
